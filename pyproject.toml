[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs576-change-detection"
version = "0.1.0"
description = "Building change detection on LEVIR-CD: image-difference baseline, U-Net-EF and Siamese U-Net."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Raviteja Gundu" },
    { name = "Joel Adu-Kwarteng" },
]
# Exact versions live in requirements.txt. torch/torchvision come preinstalled on Colab
# and are intentionally not listed, so pip never replaces Colab's CUDA build.
dependencies = [
    "numpy",
    "pillow",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import `cd` from src/ even before (or without) the editable install.
pythonpath = ["src"]
addopts = "-ra"
